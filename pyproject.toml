[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "youtube-transcript"
version = "0.1.0"
description = "Extract text transcripts from YouTube videos by video ID or URL."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "youtube-transcript-api>=1.0",
    # Used directly in fetching.py to translate transport errors; also a
    # transitive dependency of youtube-transcript-api.
    "requests>=2.0",
]

[project.scripts]
youtube-transcript = "youtube_transcript.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/youtube_transcript"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
