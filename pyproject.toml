[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "youtube-transcript"
version = "0.1.0"
description = "Extract text transcripts from YouTube videos by video ID or URL."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "youtube-transcript-api>=1.0",
    # Used directly in fetching.py to translate transport errors; also a
    # transitive dependency of youtube-transcript-api.
    "requests>=2.0",
]

[project.scripts]
youtube-transcript = "youtube_transcript_cli.cli:main"
youtube-transcript-api = "youtube_transcript_http_api.__main__:main"

[project.optional-dependencies]
api = [
    "eval-type-backport>=0.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
dev = [
    "eval-type-backport>=0.2",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pytest>=8.0",
    "ruff>=0.6",
    "uvicorn[standard]>=0.30",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/youtube_transcript",
    "src/youtube_transcript_http_api",
    "src/youtube_transcript_cli",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
